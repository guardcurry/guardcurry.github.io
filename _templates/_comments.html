<section class="comments" id="comments">
  <h2 class="comments-title">评论</h2>
  <p class="comments-hint">评论由 GitHub Discussions 提供，需要登录 GitHub 账号；你的评论会保存在本仓库的 Discussions 里，不会丢失。</p>
  <div class="giscus"></div>
  <script src="https://giscus.app/client.js"
          data-repo="{{G_REPO}}"
          data-repo-id="{{G_REPO_ID}}"
          data-category="{{G_CATEGORY}}"
          data-category-id="{{G_CATEGORY_ID}}"
          data-mapping="{{G_MAPPING}}"
          data-strict="0"
          data-reactions-enabled="{{G_REACTIONS}}"
          data-emit-metadata="0"
          data-input-position="{{G_INPUT_POSITION}}"
          data-theme="{{G_THEME}}"
          data-lang="{{G_LANG}}"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
</section>
